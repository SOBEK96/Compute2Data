name: Contracts CI

# Build pipeline for the Compute2Data intelligent contract:
#   1. genvm-lint static analysis (catches static VM errors instantly)
#   2. Direct-mode unit, regression, consensus, and boundary test suites
#
# Both tools are pinned to the versions used during development so the pipeline
# is reproducible. The direct-mode runner downloads a genvm runtime tarball
# from the genlayerlabs/genvm GitHub releases on first use; it is cached below.

on:
  push:
    paths:
      - "contracts/**"
      - "test/**"
      - "tests/**"
      - "pytest.ini"
      - "pyproject.toml"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "tests/**"
      - "pytest.ini"
      - "pyproject.toml"
      - ".github/workflows/contracts-ci.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GenLayer tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" "genvm-linter==0.11.0"

      - name: Cache genvm direct-mode runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-${{ runner.os }}

      - name: Static analysis (genvm-lint)
        run: genvm-lint check contracts/c2d_marketplace.py

      - name: Direct-mode unit and regression suites
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p gltest_direct test tests/direct -v
